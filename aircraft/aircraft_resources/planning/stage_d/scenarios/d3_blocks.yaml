# Stage D: two offset blocks (an S-curve, like B4 in the air) and an unmapped pole in the middle of the S. Frame as in d1_poles.
# Clearances: vehicle radius 0.5 + water slack 1.0 = 1.5 m each side, so the passes beside the blocks are at east >= 3.0 (first block)
# and east <= -3.0 (second block). The unmapped pole at (12.5, -4.5) sits in the west lane after the crossing, so the ROV has to swing out to
# east <= -6.1 once it senses it.
