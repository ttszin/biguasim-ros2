steps:
  # Detection-only test: fly over the BlueBoat and hover, watching /detections
  # and /biguasim/camera/image (or --show-camera) to validate ArUco/shape-target
  # detection quality before wiring up vision_land's centering/descent control.
  # No vision_land step here — land is the regular guided one, not vision-guided.
  - action: takeoff
    params:
      takeoff_altitude: 8.0

  # bsim_x = spawn_x(8) + 25 = 33, matching BOAT_LOCATION in
  # biguasim_sim_runner.py (offset from bluerov0's x=25 so they don't overlap).
  - action: go_to_known_gps_waypoint
    params:
      north: 25.0
      east: 0.0
      altitude: 8.0

  # go_to_known_gps_waypoint above only *sends* the fly-to command and advances
  # immediately (it doesn't wait for arrival) — confirm the drone is actually
  # at the boat's xy before starting the long hover/observe window below, same
  # pattern t2_land_test.yaml uses for its own return-to-platform leg.
  - action: wait_to_reach_position
    params:
      north: 25.0
      threshold: 2.0
      timeout: 120.0

  # Hover over the boat — plenty of time to watch detections come in.
  - action: wait
    params:
      duration: 180.0

  - action: land
    params:
      landing_altitude: 0.0
      vtol_transition_heading: 0.0
