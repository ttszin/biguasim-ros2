steps:
  # --- PHASE 1: Takeoff from platform ---
  - action: takeoff
    params:
      takeoff_altitude: 8.0

  # --- PHASE 2: Center on the landing target using vision, then descend ---
  # ORPHANED: used to target a synthetic "gold" sphere biguasim_sim_runner.py
  # spawned on the platform (--landing-target platform) — that flag was
  # removed (see biguasim_bridge/README.md) since ShapeTargetDetector's
  # trained YOLO model only recognizes the real BlueBoat shape and never
  # matched the sphere anyway. This mission has no valid target left; use
  # vision_land_boat_test.yaml (--spawn-boat) instead, or place a real ArUco
  # marker manually in the Unreal Editor and set target_class_id to
  # "aruco_<id>" here.
  - action: vision_land
    params:
      target_class_id: shape_target
      timeout: 120.0
      centered_threshold_deg: 5.0
      min_confirm_secs: 2.0
      # ~1m above the platform (home/platform ≈ 570.66 MSL, see t2_biguasim.parm).
      land_alt_msl: 571.5

  # --- PHASE 3: Land on platform (direct LAND mode, no RTL) ---
  - action: land
    params:
      landing_altitude: -1.0
      vtol_transition_heading: 0.0

  # Detect land_complete on platform.
  # Expected log: "Land complete ... Surface: platform."
  - action: wait_for_land_complete
    params:
      timeout: 60.0
